[project]
name = "stockapp"
version = "0.1.0"
description = "Baseline stock chart viewer used as the target codebase for agent evaluations"
requires-python = ">=3.12"
dependencies = ["flask>=3.0,<4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
